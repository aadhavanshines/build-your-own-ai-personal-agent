# Runs Sparrow's 136 tests on each Python version the book was tested with,
# with bubblewrap installed so the sandbox tests run too. No API key is
# needed: the tests use a scripted brain. The results are public on the
# repository's Actions tab.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04 limits unprivileged user namespaces with AppArmor,
      # which bubblewrap needs. Allow them on this throwaway runner only
      # (Appendix D of the book covers this on your own machine).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install the packages
        run: python -m pip install -r requirements.txt
      - name: Check the sandbox works
        run: bwrap --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 --unshare-all /bin/echo sandbox-ok
      - name: Run the tests
        run: python -m pytest -v
