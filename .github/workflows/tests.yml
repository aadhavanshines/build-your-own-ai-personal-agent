# Runs Sparrow's tests on Linux and macOS with each Python version the book
# was tested with. On Linux the sandbox tests use bubblewrap; on macOS they
# use the built-in sandbox-exec. No API key is needed: the tests use a
# scripted brain. The results are public on the repository's Actions tab.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04 limits unprivileged user namespaces with AppArmor,
      # which bubblewrap needs. Allow them on this throwaway runner only
      # (Appendix D of the book covers this on your own machine).
      - name: Allow unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install the packages
        run: python -m pip install -r requirements.txt
      - name: Check the sandbox works
        run: |
          mkdir -p /tmp/sandbox-check/files /tmp/sandbox-check/skills
          python -c "
          from pathlib import Path
          from sparrow.config import SandboxSettings
          from sparrow.sandbox import backend, run_sandboxed
          box = Path('/tmp/sandbox-check')
          code, out = run_sandboxed('echo sandbox-ok', box / 'files',
                                    box / 'skills', SandboxSettings())
          print(backend(), code, out)
          assert code == 0 and 'sandbox-ok' in out
          "
      - name: Run the tests
        run: python -m pytest -v -rs
